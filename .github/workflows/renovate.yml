name: renovate
# Self-hosted Renovate: liest renovate.json und oeffnet Dependency-PRs. Der Token
# (GitHub-PAT, repo-scope) kommt aus Infisical (Projekt fileee-mcp-server-ci / env prod),
# damit die geoeffneten PRs auch die CI-Checks triggern (der Standard-GITHUB_TOKEN kann das nicht).
on:
  schedule:
    - cron: "0 6 * * *"   # taeglich 06:00 UTC — Kaskade 5/6: nach go-fileee (Lib) und
                          # fileee-server (04:00/05:00), damit ein frischer go-fileee-Tag
                          # in derselben Nacht ankommt.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: RENOVATE_TOKEN aus Infisical holen
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: fileee-mcp-server-ci
          env-slug: prod
          secret-path: /
          domain: https://secretsmanager.strausmann.cloud
      - uses: renovatebot/github-action@v46.1.20
        with:
          token: ${{ env.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
