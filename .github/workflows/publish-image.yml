name: publish-image
# Manueller Image-Build+Push (Backfill / Ausserfall). Baut deploy/Dockerfile aus einem
# Git-Ref und pusht nach GHCR + Docker Hub. Docker-Hub-Credentials kommen aus Infisical
# (Projekt fileee-mcp-server-ci / env prod), Auth via Machine-Identity-Bootstrap-Secrets.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git-Tag/Ref zum Bauen (z. B. v0.1.0)"
        required: true
        default: "v0.1.0"
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Version aus Ref ableiten (fuehrendes v entfernen)
        id: ver
        env:
          REF: ${{ inputs.ref }}
        run: echo "version=$(printf '%s' "$REF" | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Docker-Hub-Secrets aus Infisical holen
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: fileee-mcp-server-ci
          env-slug: prod
          secret-path: /
          domain: https://secretsmanager.strausmann.cloud
      - uses: docker/setup-buildx-action@v4
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Image-Tags berechnen (semver-kaskade major/minor/patch + latest)
        id: tags
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          major=${V%%.*}
          minor=${V%.*}
          {
            echo 'list<<TAGS'
            for img in ghcr.io/strausmann/fileee-mcp-server strausmann/fileee-mcp-server; do
              echo "$img:$V"
              echo "$img:$minor"
              echo "$img:$major"
              echo "$img:latest"
            done
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
