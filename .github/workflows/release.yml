name: release
on:
  schedule:
    - cron: "0 7 * * *"   # taeglich 07:00 UTC — 1h nach dem eigenen Renovate-Lauf (06:00) und
                          # nach der go-fileee/fileee-server-Kaskade. NIE on push (User-Vorgabe).
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # SSH-Deploy-Key: semantic-release pusht CHANGELOG+Tag ueber SSH (repositoryUrl in
          # .releaserc.json ist SSH). Der Deploy-Key ist Bypass-Actor im main-Ruleset -> Push
          # kommt an protected main vorbei (Bot/GITHUB_TOKEN kann auf persoenlichem Repo NICHT
          # Ruleset-Bypass sein). @semantic-release/github nutzt weiter GITHUB_TOKEN fuer die API.
          ssh-key: "${{ secrets.SSH_DEPLOY_KEY }}"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - id: semrel
        run: |
          npx semantic-release
          echo "version=$(git tag --points-at HEAD | grep '^v' | sed 's/^v//' | head -1)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Solange das Repo im Aufbau ist, existiert deploy/Dockerfile noch nicht. Ohne diese
      # Pruefung wuerde der geplante naechtliche Lauf nach jedem erfolgreichen Release im
      # Build-Schritt hart scheitern — ein rotes Kreuz, das nichts ueber die Codequalitaet
      # aussagt und deshalb schnell ignoriert wird. Der Job meldet stattdessen eine Notice
      # und endet gruen. Sobald deploy/Dockerfile existiert, greift er automatisch.
      - name: Pruefen, ob deploy/Dockerfile vorhanden ist
        id: dockerfile
        run: |
          if [[ -f deploy/Dockerfile ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy/Dockerfile fehlt noch — Image-Build wird uebersprungen."
          fi
      - name: Docker-Hub-Secrets aus Infisical holen
        if: steps.dockerfile.outputs.exists == 'true'
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: fileee-mcp-server-ci
          env-slug: prod
          secret-path: /
          domain: https://secretsmanager.strausmann.cloud
      - uses: docker/setup-buildx-action@v4
        if: steps.dockerfile.outputs.exists == 'true'
      - name: Login GHCR
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Docker Hub
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Image-Tags berechnen (semver-kaskade major/minor/patch + latest)
        if: steps.dockerfile.outputs.exists == 'true'
        id: tags
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          major=${V%%.*}
          minor=${V%.*}
          {
            echo 'list<<TAGS'
            for img in ghcr.io/strausmann/fileee-mcp-server strausmann/fileee-mcp-server; do
              echo "$img:$V"
              echo "$img:$minor"
              echo "$img:$major"
              echo "$img:latest"
            done
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Build-Metadaten für OCI-Labels/ldflags ermitteln
        if: steps.dockerfile.outputs.exists == 'true'
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # VERSION/REVISION/CREATED speisen sowohl die OCI-Labels (org.opencontainers.image.*,
          # deploy/Dockerfile) als auch den ldflags-Override von
          # cmd/fileee-mcp-server/version.go (main.version).
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
