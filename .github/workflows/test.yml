name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      # golangci-lint als Go-Linter-Standard (statt MegaLinter) — siehe .golangci.yml und
      # .claude/skills/repo-bootstrap/SKILL.md im homelab-management-Repo.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go build ./...
      - run: go vet ./...
      # -race braucht cgo (Race-Detector-Runtime); der Server-Build selbst bleibt pure-Go
      # (go build/vet oben laufen mit CGO_ENABLED=0). Nur diese Stufe aktiviert cgo.
      - name: Test (race + coverage)
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -coverprofile=cover.out
      - name: Coverage-Gate (test-coverage-pflicht.md)
        run: |
          chmod +x scripts/coverage-gate-strict.sh
          # Die Schwellen kommen aus der Regel-Tabelle in test-coverage-pflicht.md
          # (homelab-management), NICHT aus der gemessenen Ist-Coverage: bei einem
          # Greenfield-Repo waere "an der Messung orientiert" zirkulaer und wuerde die
          # Mindestwerte unterlaufen.
          #
          #   Auth-/Permission-Code ......... 90   auth_oidc.go, auth_token.go,
          #                                        internal/accounts/accounts.go,
          #                                        internal/config/config.go,
          #                                        internal/server/scopes.go,
          #                                        internal/server/ratelimit.go,
          #                                        internal/diag/diag.go (sicherheitskritisch:
          #                                        die Maskierung, die verhindert, dass ein
          #                                        Credential ins Diagnose-Protokoll gelangt)
          #   Mutations-Logik ............... 85   internal/clientpool/pool.go,
          #                                        tools_destructive.go,
          #                                        alle mutierenden Tool-Pfade
          #   Business-Logik ................ 80   uebrige tools_*.go,
          #                                        internal/server/server.go, errors.go
          #   Adapter/Boot .................. 60   cmd/fileee-mcp-server/main.go, secrets.go
          #
          # Noch nicht existierende Dateien (auth_oidc.go, auth_token.go,
          # tools_destructive.go, tools_*.go, errors.go, secrets.go) sind bewusst ohne
          # Verzeichnis notiert - ihr Paketzuschnitt (u.a. internal/tools) entsteht im
          # jeweiligen Umsetzungsschritt.
          #
          # Die Liste waechst mit jedem Umsetzungsschritt mit. Jede neue Datei bekommt
          # ihre Schwelle im selben PR, in dem sie entsteht — nachtraeglich nachziehen
          # heisst, das Gate fuer diese Datei nie scharf zu schalten.
          #
          # internal/tools erweitert (Stand dieses PR, gemessen nach dem Zusammenfuehren der
          # Dokument-/Personen-Werkzeuge): read.go war bereits gegattert (80, Business-Logik-
          # Stufe wie oben). Vier weitere Dateien derselben Stufe erreichen 80% bereits mit
          # Luft und werden hier scharf geschaltet:
          #   read_sync.go      80,6%   read_people.go   83,3%
          #   names.go          87,0%
          # (Bei read_sync.go ist die Luft ueber der Schwelle knapp — 0,6 Punkte. Das ist die
          # 80%-Business-Logik-Stufe selbst, keine eigens gewaehlte Marge; siehe PR-Beschreibung.)
          #
          # ZWEI Dateien derselben Stufe erreichen 80% NOCH NICHT: read_generic.go (79,3%) und
          # read_reference.go (77,3%). Kontrollierte Ausnahme statt Luecke oder erfundenem
          # Ersatzwert (test-coverage-pflicht.md, Abschnitt "Coverage-Whitelist") — Begruendung,
          # Weg zum Ziel und Verfallsdatum je Datei:
          #
          #   read_generic.go:75 — Begruendung: genericListHandler (70%) und genericGetHandler
          #     (50%) ziehen die Datei unter 80. Deren Erfolgspfad haengt an clientFor/einer
          #     verifizierten Identitaet aus dem Kontext und ist aus diesem White-Box-Paket
          #     heraus nicht ohne einen echten Gangway/HTTP-Rundlauf testbar (siehe deren eigene
          #     Doc-Kommentare) — keine vergessene Zeile, sondern eine strukturelle Grenze des
          #     Unit-Tests. Die Logik-Ebene darunter (getFromService/listFromService/
          #     untrustedLineOf) liegt bereits bei 87,5%/92,9%/100% (#51). 75 statt 80 laesst
          #     Raum fuer eine weitere Funktion, ohne beim naechsten Commit rot zu faerben, und
          #     faengt trotzdem ein Absinken unter den heutigen Stand ab.
          #     Weg zum Ziel: Integrationstest nach dem Muster von internal/server/server_test.go
          #     (echter Gangway/HTTP-Rundlauf mit verifizierter Identitaet) fuer beide Handler.
          #     Verfallsdatum: 2026-09-15 — dann auf 80 nachziehen oder Ausnahme neu begruenden.
          #
          #   read_reference.go:75 — Begruendung: referenceTagDescriptor (33%) und
          #     referenceDocumentTypeDescriptor (67%) ziehen die Datei unter 80 — reine
          #     Deskriptor-Bauer, die nur indirekt ueber registerReadService/Registrierungstests
          #     erreicht werden, nicht ueber eigene Tests ihrer Summarize/UntrustedLine-Closures.
          #     Weg zum Ziel: gezielte Tests je Deskriptor-Funktion (Muster: tagDescriptor() in
          #     read_generic_test.go).
          #     Verfallsdatum: 2026-09-15 — dann auf 80 nachziehen oder Ausnahme neu begruenden.
          #
          # internal/tools nochmal erweitert (Boxen/Binaerdaten/OCR/Kontostand, #55): DREI weitere
          # Dateien derselben Business-Logik-Stufe erreichen 80% NOCH NICHT — derselbe Grund wie
          # bei read_generic.go/read_reference.go oben, hier noch ausgepraegter, weil jede Datei
          # mehrere duenne Werkzeug-Anmelde-Huellen (getXxxHandler) traegt, die alle an
          # clientFor/einer verifizierten Identitaet aus dem Kontext haengen und aus diesem
          # White-Box-Paket heraus nicht ohne einen echten Gangway/HTTP-Rundlauf testbar sind:
          #
          #   read_boxes.go:60 — gemessen 61,9%. listBoxesHandler (10%) und getBoxHandler (50%)
          #     ziehen die Datei unter 80. Die Logik-Ebene darunter (boxesFromService/
          #     boxFromService/boxSummaryOf/boxDetailOf) liegt bereits bei 100%.
          #     Weg zum Ziel: Integrationstest nach dem Muster von internal/server/server_test.go
          #     fuer beide Handler.
          #     Verfallsdatum: 2026-09-15 — dann auf 80 nachziehen oder Ausnahme neu begruenden.
          #
          #   read_binary.go:68 — gemessen 71,3%. getDocumentPDFHandler/getPageImageHandler
          #     (63,2%) und getPageOCRHandler (50%) ziehen die Datei unter 80; parsePDFMode/
          #     parseImageSize selbst liegen bei 50% (nur der Ablehnungspfad eines unbekannten
          #     Werts ist ueber den Handler getestet, kein eigener Erfolgstest fuer den
          #     benannten Zweitwert "print"/"smedium"). Die Kernlogik (readLimited,
          #     documentPDFFromService, documentPageImageFromService,
          #     documentPageOCRFromService) liegt bei 87,5-92,9%.
          #     Weg zum Ziel: Integrationstest fuer die drei Handler; je ein expliziter
          #     Erfolgstest fuer parsePDFMode("print") und parseImageSize("smedium").
          #     Verfallsdatum: 2026-09-15 — dann auf 80 nachziehen oder Ausnahme neu begruenden.
          #
          #   read_account.go:50 — gemessen 52,6%. getAccountStatusHandler (10%) zieht die Datei
          #     unter 80 — derselbe Grund, staerker ausgepraegt, weil die Datei sonst nur aus
          #     bereits vollstaendig getesteter Logik besteht (accountStatusDetail,
          #     accountStatusFromService, formatTimePtr, registerAccountTools: alle 100%) und
          #     ein einzelner duenner Handler den ganzen Dateidurchschnitt traegt.
          #     Weg zum Ziel: Integrationstest nach demselben Muster.
          #     Verfallsdatum: 2026-09-15 — dann auf 80 nachziehen oder Ausnahme neu begruenden.
          #
          # Alle drei Schwellen liegen unter dem gemessenen Ist-Stand (nicht darauf) — eine
          # Schranke exakt auf dem Ist-Stand faerbt beim naechsten Commit rot und wird dann nur
          # entschaerft statt eingehalten (test-coverage-pflicht.md, Abschnitt
          # "Coverage-Whitelist"). Gegenprobe (lokal, scripts/coverage-gate-strict.sh): eine
          # probeweise unerreichbar hohe Schwelle (99) liess das Gate fuer alle drei Dateien
          # FAILen; die hier eingetragenen Werte bestehen denselben Lauf.
          #
          # internal/tools/ops.go (Aufgabe C3, self_check): fehlte hier bisher, weil die Datei
          # entstand, waehrend diese Schranke gebaut wurde (nur get_runtime_stats/
          # get_tool_manifest, keiner der beiden ruehrt Fileee an). Mit self_check kommt die
          # erste echte Anmeldeprobe in die Datei — gemessen 87,1%, komfortabel ueber 80: die
          # Kernlogik (classifySelfCheckOutcome, selfCheckResultFor) liegt bei 100%, einzig
          # getSelfCheckHandler (44,4%) zieht den Dateidurchschnitt, aus demselben Grund wie
          # read_boxes.go/read_binary.go/read_account.go oben — die duenne Anmelde-Huelle haengt
          # an clientFor-aequivalenter Identitaetsaufloesung aus dem Kontext, aus diesem
          # White-Box-Paket heraus nicht ohne einen echten Gangway/HTTP-Rundlauf testbar.
          #
          # internal/tools/write.go (Task 1+2, write-Tools-Plan, homelab-management repo):
          # erste Datei des Write-Werkzeug-Baukastens. Task 1 (update_contact, Patch/Merge-
          # Vorlage) und Task 2 (create_contact, ein einzelner Create-Aufruf, kein
          # vorheriges Get) teilen sich die Datei. Business-Logik-Stufe (80) wie read.go/
          # read_sync.go/read_people.go/names.go/ops.go oben — die Kernlogik
          # (applyContactPatch, contactDisplayName, updateContactResult,
          # updateContactFromService, createContactResult, createContactFromService) ist
          # ueber Fakes (fakeContactWriteService/fakeContactCreateService, write_test.go)
          # vollstaendig ohne Netzwerk testbar. updateContactHandlers/createContactHandlers
          # duenne clientFor-Huelle traegt denselben strukturellen weissen Fleck wie
          # getAccountStatusHandler/getBoxHandler (read_account.go/read_boxes.go oben) —
          # createContactHandler haelt sich trotzdem bei ueber 80%, weil seine eigene
          # Vor-clientFor-Pruefung (FirstName/LastName/CompanyName nicht alle leer, das
          # Gegenstueck zu updateContactHandlers leere-ID-Pruefung) direkt testbar ist.
          #
          # internal/tools/write_people.go (Task 3, write-Tools-Plan): create_reminder +
          # update_reminder, dieselben zwei Muster wie write.go (Create ohne vorheriges Get /
          # Get-apply-Update-Patch-Merge), diesmal ueber fileee.ReminderService. Kernlogik
          # (applyReminderPatch, reminderResult, createReminderFromService,
          # updateReminderFromService) ueber Fakes (fakeReminderCreateService/
          # fakeReminderWriteService, write_people_test.go) vollstaendig ohne Netzwerk testbar.
          # Beide duennen clientFor-Huellen (createReminderHandler/updateReminderHandler)
          # bekommen zusaetzlich je einen Gegenprobe-Test, der eine GUELTIGE Eingabe bis zu
          # clientFor durchlaesst (TestCreateReminderHandlerLaesstEineGueltigeBeschreibung...,
          # TestUpdateReminderHandlerLaesstEineGueltigeKennung...) — dieselbe Idee wie
          # createContactHandlers eigener Firmenkontakt-Test oben, hier zusaetzlich fuer
          # update_reminder nachgezogen (update_contact hat diesen Gegenprobe-Test bislang
          # nicht). Datei liegt bei 85,0% — komfortabel ueber der 80%-Business-Logik-Stufe,
          # keine Ausnahme noetig.
          ./scripts/coverage-gate-strict.sh cover.out \
            internal/accounts/accounts.go:90 \
            internal/config/config.go:90 \
            internal/config/version.go:90 \
            internal/server/scopes.go:90 \
            internal/server/ratelimit.go:90 \
            internal/diag/diag.go:90 \
            internal/server/server.go:80 \
            internal/clientpool/pool.go:85 \
            internal/tools/read.go:80 \
            internal/tools/read_sync.go:80 \
            internal/tools/read_people.go:80 \
            internal/tools/names.go:80 \
            internal/tools/read_generic.go:75 \
            internal/tools/read_reference.go:75 \
            internal/tools/read_boxes.go:60 \
            internal/tools/read_binary.go:68 \
            internal/tools/read_account.go:50 \
            internal/tools/ops.go:80 \
            internal/tools/write.go:80 \
            internal/tools/write_people.go:80 \
            cmd/fileee-mcp-server/main.go:60
      - name: Doc-Coverage (exportierte Symbole)
        run: |
          chmod +x scripts/doc-coverage.sh
          ./scripts/doc-coverage.sh
      - name: ADR-Registry (Registry-Pflicht + Lineage)
        run: |
          chmod +x scripts/adr-registry-check.sh
          ./scripts/adr-registry-check.sh
      - name: Entrypoint-Entscheidung (Start mit und ohne Infisical)
        run: |
          chmod +x deploy/entrypoint.sh deploy/entrypoint_test.sh
          ./deploy/entrypoint_test.sh
